<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PvP Tetris | Регистрация — Кибер-аккаунт</title>
    <!-- Подключаем шрифты и иконки -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&family=Orbitron:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
            font-family: 'Inter', 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
        }

        /* Анимированный фон с сеткой и неоном */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .cyber-bg .grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            transform: rotateX(45deg) rotateZ(15deg);
            opacity: 0.5;
        }

        @keyframes gridMove {
            0% {
                transform: rotateX(45deg) rotateZ(15deg) translateY(0);
            }

            100% {
                transform: rotateX(45deg) rotateZ(15deg) translateY(50px);
            }
        }

        /* Неоновые шары */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }

        .orb1 {
            width: 40vw;
            height: 40vw;
            background: #ff00cc;
            top: -20vh;
            left: -10vw;
            animation-duration: 15s;
        }

        .orb2 {
            width: 35vw;
            height: 35vw;
            background: #00ffff;
            bottom: -15vh;
            right: -5vw;
            animation-duration: 18s;
            opacity: 0.3;
        }

        .orb3 {
            width: 25vw;
            height: 25vw;
            background: #ffaa00;
            top: 40vh;
            left: 60vw;
            animation-duration: 20s;
            filter: blur(100px);
            opacity: 0.25;
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(5%, 5%) scale(1.1);
            }
        }

        /* ГЛАВНЫЙ HEADER (упрощённый для страницы регистрации, но стильный) */
        .hero-header {
            position: relative;
            margin-top: 2rem;
            margin-bottom: 2rem;
            width: 90%;
            max-width: 1400px;
            border-radius: 60px;
            background: rgba(8, 12, 25, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .hero-header:hover {
            border-color: rgba(0, 255, 255, 0.7);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 45px rgba(0, 255, 255, 0.4);
        }

        .header-border-glow {
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 2px;
            background: linear-gradient(90deg, #00ffff, #ff00cc, #ffaa00, #00ffff);
            background-size: 300% 300%;
            animation: borderFlow 6s ease infinite;
            opacity: 0.7;
            pointer-events: none;
            z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        @keyframes borderFlow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .header-content {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .tetris-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 20px #ff00cc);
            animation: iconPulse 2s infinite alternate;
        }

        @keyframes iconPulse {
            0% {
                filter: drop-shadow(0 0 5px #00ffff) drop-shadow(0 0 10px #ff00cc);
                transform: scale(1);
            }

            100% {
                filter: drop-shadow(0 0 15px #0ff) drop-shadow(0 0 25px #f0f);
                transform: scale(1.05);
            }
        }

        .logo-text h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #00ffff, #ff66cc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .back-link {
            background: rgba(0, 0, 0, 0.5);
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            color: cyan;
            text-decoration: none;
            font-family: 'Orbitron';
            font-weight: 500;
            backdrop-filter: blur(4px);
            border: 1px solid cyan;
            transition: 0.2s;
        }

        .back-link:hover {
            background: cyan;
            color: black;
            box-shadow: 0 0 20px cyan;
        }

        /* ОСНОВНАЯ ФОРМА РЕГИСТРАЦИИ — КРУТАЯ И КРАСИВАЯ */
        .register-section {
            width: 90%;
            max-width: 550px;
            margin: 0 auto 3rem;
            position: relative;
        }

        .glass-card {
            background: rgba(8, 16, 30, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 255, 0.1) inset, 0 0 30px rgba(0, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .glass-card:hover {
            border-color: rgba(0, 255, 255, 0.8);
            box-shadow: 0 30px 55px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(0, 255, 255, 0.2) inset, 0 0 45px rgba(0, 255, 255, 0.3);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header .glow-icon {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #0ff, #f0f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 15px cyan);
            margin-bottom: 0.5rem;
        }

        .form-header h2 {
            font-family: 'Orbitron';
            font-size: 2rem;
            background: linear-gradient(135deg, #fff, #0ff, #ff66cc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .form-header p {
            color: #aaf0ff;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.8rem;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: cyan;
            font-size: 1.2rem;
            text-shadow: 0 0 5px cyan;
            transition: 0.2s;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 10, 20, 0.6);
            border: 1.5px solid rgba(0, 255, 255, 0.4);
            border-radius: 60px;
            padding: 1rem 1rem 1rem 3rem;
            font-family: 'Inter', monospace;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .input-group input:focus {
            border-color: cyan;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 5px rgba(0, 255, 255, 0.2);
            background: rgba(0, 20, 40, 0.7);
        }

        .input-group input::placeholder {
            color: rgba(170, 240, 255, 0.6);
            font-weight: 400;
        }

        /* чекбокс согласия */
        .agree-terms {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1.5rem 0;
            color: #bbddff;
            font-size: 0.85rem;
        }

        .agree-terms input {
            width: 18px;
            height: 18px;
            accent-color: cyan;
            cursor: pointer;
        }

        .register-btn {
            width: 100%;
            background: linear-gradient(95deg, #00aaff, #ff00aa);
            border: none;
            padding: 1rem;
            border-radius: 60px;
            font-family: 'Orbitron';
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .register-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px cyan;
            filter: brightness(1.05);
        }

        /* Альтернативные способы входа */
        .alternative {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px dashed rgba(0, 255, 255, 0.3);
        }

        .alternative p {
            color: #8ab3ff;
            margin-bottom: 1rem;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .social-icon {
            background: rgba(0, 20, 40, 0.6);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: cyan;
            border: 1px solid cyan;
            transition: 0.2s;
            cursor: pointer;
        }

        .social-icon:hover {
            background: cyan;
            color: black;
            transform: translateY(-3px);
            box-shadow: 0 0 20px cyan;
        }

        .login-redirect {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .login-redirect a {
            color: #0ff;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px solid cyan;
        }

        .login-redirect a:hover {
            text-shadow: 0 0 8px cyan;
        }

        /* валидация и уведомления */
        .error-msg {
            color: #ff66aa;
            font-size: 0.75rem;
            margin-top: 5px;
            margin-left: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .success-glow {
            text-align: center;
            color: #0f0;
            text-shadow: 0 0 5px lime;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            .glass-card {
                padding: 1.8rem;
            }

            .form-header h2 {
                font-size: 1.5rem;
            }

            .register-btn {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="cyber-bg">
        <div class="grid"></div>
        <div class="glow-orb orb1"></div>
        <div class="glow-orb orb2"></div>
        <div class="glow-orb orb3"></div>
    </div>

    <header class="hero-header">
        <div class="header-border-glow"></div>
        <div class="header-content">
            <div class="brand">
                <div class="tetris-icon">
                    <i class="fas fa-cubes"></i>
                </div>
                <div class="logo-text">
                    <h1>⚡ PVP TETRIS ⚡</h1>
                </div>
            </div>
            <a href="#" class="back-link" id="backToHome"><i class="fas fa-arrow-left"></i> На главную</a>
        </div>
    </header>

    <!-- Секция регистрации — КРУТАЯ форма -->
    <div class="register-section">
        <div class="glass-card">
            <div class="form-header">
                <div class="glow-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>КИБЕР-РЕГИСТРАЦИЯ</h2>
                <p>Присоединяйся к элите PvP Tetris ⚡</p>
            </div>

            <form id="registerForm">
                <div class="input-group">
                    <i class="fas fa-user-astronaut"></i>
                    <input type="text" id="username" placeholder="Игровой никнейм" autocomplete="off">
                    <div id="usernameError" class="error-msg"></div>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Электронная почта">
                    <div id="emailError" class="error-msg"></div>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Пароль">
                    <div id="passwordError" class="error-msg"></div>
                </div>

                <div class="input-group">
                    <i class="fas fa-key"></i>
                    <input type="password" id="confirmPassword" placeholder="Подтверждение пароля">
                    <div id="confirmError" class="error-msg"></div>
                </div>

                <div class="agree-terms">
                    <input type="checkbox" id="termsCheckbox">
                    <label for="termsCheckbox">Я соглашаюсь с <span style="color:cyan">Условиями Арены</span> и <span
                            style="color:cyan">Политикой Кибер-безопасности</span></label>
                </div>

                <button type="submit" class="register-btn">
                    <i class="fas fa-sync-alt"></i> СОЗДАТЬ АККАУНТ
                </button>
            </form>

            <div id="formMessage" style="margin-top: 1rem; text-align: center; font-weight: bold;"></div>

            <div class="alternative">
                <p><i class="fas fa-globe"></i> Или войти через</p>
                <div class="social-icons">
                    <div class="social-icon"><i class="fab fa-discord"></i></div>
                    <div class="social-icon"><i class="fab fa-google"></i></div>
                    <div class="social-icon"><i class="fab fa-steam"></i></div>
                    <div class="social-icon"><i class="fab fa-twitch"></i></div>
                </div>
            </div>

            <div class="login-redirect">
                Уже есть аккаунт? <a href="#" id="loginRedirect">Войти в систему →</a>
            </div>
        </div>
    </div>

    <script>
        // Эффекты, валидация + КРУТАЯ анимация
        const form = document.getElementById('registerForm');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const termsCheck = document.getElementById('termsCheckbox');
        const formMessageDiv = document.getElementById('formMessage');

        // Очистка ошибок
        function clearErrors() {
            document.getElementById('usernameError').innerHTML = '';
            document.getElementById('emailError').innerHTML = '';
            document.getElementById('passwordError').innerHTML = '';
            document.getElementById('confirmError').innerHTML = '';
            formMessageDiv.innerHTML = '';
        }

        function showFieldError(fieldId, message) {
            const errorDiv = document.getElementById(fieldId + 'Error');
            if (errorDiv) errorDiv.innerHTML = message ? `<i class="fas fa-exclamation-triangle"></i> ${message}` : '';
        }

        // Валидация
        function validateForm() {
            let isValid = true;
            clearErrors();

            const username = usernameInput.value.trim();
            if (username.length < 3) {
                showFieldError('username', 'Никнейм должен содержать минимум 3 символа');
                isValid = false;
            } else if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                showFieldError('username', 'Разрешены только буквы, цифры и _');
                isValid = false;
            }

            const email = emailInput.value.trim();
            const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showFieldError('email', 'Введите корректный email');
                isValid = false;
            }

            const password = passwordInput.value;
            if (password.length < 6) {
                showFieldError('password', 'Пароль должен быть не менее 6 символов');
                isValid = false;
            } else if (!/[A-Za-z]/.test(password) || !/\d/.test(password)) {
                showFieldError('password', 'Пароль должен содержать буквы и цифры');
                isValid = false;
            }

            const confirm = confirmInput.value;
            if (confirm !== password) {
                showFieldError('confirm', 'Пароли не совпадают');
                isValid = false;
            }

            if (!termsCheck.checked) {
                formMessageDiv.innerHTML = '<span style="color:#ff66aa;"><i class="fas fa-times-circle"></i> Необходимо принять условия Арены</span>';
                isValid = false;
            }

            return isValid;
        }

        // Эффект искр при успешной регистрации
        function createFireworks() {
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'fixed';
                particle.style.width = '6px';
                particle.style.height = '6px';
                particle.style.background = `hsl(${Math.random() * 60 + 180}, 100%, 60%)`;
                particle.style.borderRadius = '50%';
                particle.style.boxShadow = '0 0 10px cyan';
                particle.style.left = '50%';
                particle.style.top = '50%';
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '9999';
                const angle = Math.random() * Math.PI * 2;
                const velocity = 4 + Math.random() * 8;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;
                particle.style.transform = `translate(-50%, -50%)`;
                document.body.appendChild(particle);

                let posX = window.innerWidth / 2;
                let posY = window.innerHeight / 2;
                let opacity = 1;
                function animateParticle() {
                    posX += vx;
                    posY += vy;
                    opacity -= 0.02;
                    particle.style.left = posX + 'px';
                    particle.style.top = posY + 'px';
                    particle.style.opacity = opacity;
                    if (opacity <= 0) {
                        particle.remove();
                    } else {
                        requestAnimationFrame(animateParticle);
                    }
                }
                requestAnimationFrame(animateParticle);
            }
            // дополнительный неоновый текст
            const successMsg = document.createElement('div');
            successMsg.innerText = '✨ РЕГИСТРАЦИЯ УСПЕШНА! ДОБРО ПОЖАЛОВАТЬ В ЭЛИТУ ✨';
            successMsg.style.position = 'fixed';
            successMsg.style.top = '40%';
            successMsg.style.left = '50%';
            successMsg.style.transform = 'translate(-50%, -50%)';
            successMsg.style.background = 'rgba(0,0,0,0.8)';
            successMsg.style.backdropFilter = 'blur(15px)';
            successMsg.style.padding = '20px 30px';
            successMsg.style.borderRadius = '60px';
            successMsg.style.fontFamily = 'Orbitron';
            successMsg.style.fontWeight = 'bold';
            successMsg.style.fontSize = '1.3rem';
            successMsg.style.color = '#0ff';
            successMsg.style.border = '2px solid cyan';
            successMsg.style.boxShadow = '0 0 50px cyan';
            successMsg.style.zIndex = '10000';
            successMsg.style.textAlign = 'center';
            successMsg.style.whiteSpace = 'nowrap';
            document.body.appendChild(successMsg);
            setTimeout(() => successMsg.remove(), 2800);
        }

        // Обработка сабмита
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (validateForm()) {
                // Имитация отправки на сервер + супер-эффект
                const btn = document.querySelector('.register-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> РЕГИСТРАЦИЯ...';
                btn.disabled = true;

                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    // Показываем успех
                    formMessageDiv.innerHTML = '<span style="color:#0ff; text-shadow:0 0 5px cyan;"><i class="fas fa-check-circle"></i> Аккаунт создан! Перенаправление...</span>';
                    createFireworks();
                    // Очищаем форму для красоты
                    usernameInput.value = '';
                    emailInput.value = '';
                    passwordInput.value = '';
                    confirmInput.value = '';
                    termsCheck.checked = false;
                    // Через 2 секунды редирект на главную (демо)
                    setTimeout(() => {
                        window.location.href = '#';
                        alert('Добро пожаловать в PvP Tetris! Теперь вы можете войти в личный кабинет.\n(Демо-переход)');
                        formMessageDiv.innerHTML = '';
                    }, 2200);
                }, 1300);
            } else {
                // Эффект "тряски" формы при ошибке
                const card = document.querySelector('.glass-card');
                card.style.transform = 'translateX(5px)';
                setTimeout(() => card.style.transform = 'translateX(-5px)', 50);
                setTimeout(() => card.style.transform = 'translateX(3px)', 100);
                setTimeout(() => card.style.transform = 'translateX(0)', 150);
                // неоновое предупреждение
                formMessageDiv.style.color = '#ff66aa';
            }
        });

        // Кнопка "На главную"
        document.getElementById('backToHome').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Возврат на главную страницу PvP Tetris (демо-режим)');
            // Можно сделать смену контента, но для демонстрации просто редирект на #
        });

        // Имитация входа (редирект)
        document.getElementById('loginRedirect').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Открыть страницу авторизации / Вход в аккаунт (в разработке)');
        });

        // Эффект фокуса и глитч на инпутах
        const inputs = document.querySelectorAll('.input-group input');
        inputs.forEach(inp => {
            inp.addEventListener('focus', () => {
                inp.parentElement.style.transform = 'scale(1.01)';
                inp.parentElement.style.transition = '0.2s';
            });
            inp.addEventListener('blur', () => {
                inp.parentElement.style.transform = '';
            });
        });

        // Социальные кнопки с крутым уведомлением
        const socials = document.querySelectorAll('.social-icon');
        socials.forEach(icon => {
            icon.addEventListener('click', () => {
                alert('✨ Интеграция с соцсетями: скоро вы сможете войти через Discord/Google/Steam! ✨');
            });
        });

        // Анимация при загрузке - добавить класс для карты
        window.addEventListener('load', () => {
            const card = document.querySelector('.glass-card');
            card.style.animation = 'glowPulse 1s ease';
            const styleAnim = document.createElement('style');
            styleAnim.innerHTML = `@keyframes glowPulse { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }`;
            document.head.appendChild(styleAnim);
        });
    </script>

</body>

</html>
