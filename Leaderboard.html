<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PvP Tetris | Рейтинг — Таблица лидеров</title>
    <!-- Подключаем шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
            font-family: 'Inter', 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
        }

        /* Анимированный фон с сеткой и неоном */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .cyber-bg .grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            transform: rotateX(45deg) rotateZ(15deg);
            opacity: 0.5;
        }

        @keyframes gridMove {
            0% { transform: rotateX(45deg) rotateZ(15deg) translateY(0); }
            100% { transform: rotateX(45deg) rotateZ(15deg) translateY(50px); }
        }

        /* Неоновые шары */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }

        .orb1 { width: 40vw; height: 40vw; background: #ff00cc; top: -20vh; left: -10vw; animation-duration: 15s; }
        .orb2 { width: 35vw; height: 35vw; background: #00ffff; bottom: -15vh; right: -5vw; animation-duration: 18s; opacity: 0.3; }
        .orb3 { width: 25vw; height: 25vw; background: #ffaa00; top: 40vh; left: 60vw; animation-duration: 20s; filter: blur(100px); opacity: 0.25;}

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }

        /* ГЛАВНЫЙ HEADER */
        .hero-header {
            position: relative;
            margin-top: 2rem;
            margin-bottom: 2rem;
            width: 90%;
            max-width: 1400px;
            border-radius: 60px;
            background: rgba(8, 12, 25, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .hero-header:hover {
            border-color: rgba(0, 255, 255, 0.7);
            box-shadow: 0 30px 50px rgba(0,0,0,0.6), 0 0 45px rgba(0, 255, 255, 0.4);
        }

        .header-border-glow {
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 2px;
            background: linear-gradient(90deg, #00ffff, #ff00cc, #ffaa00, #00ffff);
            background-size: 300% 300%;
            animation: borderFlow 6s ease infinite;
            opacity: 0.7;
            pointer-events: none;
            z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-content {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .tetris-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 20px #ff00cc);
            animation: iconPulse 2s infinite alternate;
        }

        @keyframes iconPulse {
            0% { filter: drop-shadow(0 0 5px #00ffff) drop-shadow(0 0 10px #ff00cc); transform: scale(1);}
            100% { filter: drop-shadow(0 0 15px #0ff) drop-shadow(0 0 25px #f0f); transform: scale(1.05);}
        }

        .logo-text h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #00ffff, #ff66cc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .back-link {
            background: rgba(0, 0, 0, 0.5);
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            color: cyan;
            text-decoration: none;
            font-family: 'Orbitron';
            font-weight: 500;
            backdrop-filter: blur(4px);
            border: 1px solid cyan;
            transition: 0.2s;
        }
        .back-link:hover {
            background: cyan;
            color: black;
            box-shadow: 0 0 20px cyan;
        }

        /* ОСНОВНАЯ СЕКЦИЯ РЕЙТИНГА */
        .leaderboard-section {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 3rem;
        }

        .glass-card {
            background: rgba(8, 16, 30, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 2rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,255,255,0.1) inset, 0 0 30px rgba(0,255,255,0.2);
            transition: all 0.3s;
        }

        .glass-card:hover {
            border-color: rgba(0, 255, 255, 0.8);
            box-shadow: 0 30px 55px rgba(0,0,0,0.6), 0 0 0 2px rgba(0,255,255,0.2) inset, 0 0 45px rgba(0,255,255,0.3);
        }

        /* заголовок и переключатели */
        .leaderboard-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
            border-bottom: 1px solid rgba(0,255,255,0.3);
            padding-bottom: 1rem;
        }

        .title-section h2 {
            font-family: 'Orbitron';
            font-size: 1.8rem;
            background: linear-gradient(135deg, #fff, #0ff, #ff66cc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .title-section p {
            color: #8ab3ff;
            font-size: 0.85rem;
        }

        .period-switch {
            display: flex;
            gap: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.4rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        .period-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.5rem;
            font-family: 'Orbitron';
            font-weight: 600;
            font-size: 0.9rem;
            color: #ccf4ff;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }

        .period-btn.active {
            background: linear-gradient(95deg, #00aaff, #ff00aa);
            color: white;
            box-shadow: 0 0 15px cyan;
        }

        .period-btn:hover:not(.active) {
            background: rgba(0, 255, 255, 0.2);
        }

        /* Таблица */
        .rank-table-container {
            overflow-x: auto;
            margin-top: 1rem;
        }

        .rank-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Inter', monospace;
        }

        .rank-table th {
            text-align: left;
            padding: 1rem 0.8rem;
            color: cyan;
            font-family: 'Orbitron';
            font-weight: 600;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(0, 255, 255, 0.4);
        }

        .rank-table td {
            padding: 1rem 0.8rem;
            color: #e0f2fe;
            font-weight: 500;
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
            transition: 0.2s;
        }

        .rank-table tr:hover td {
            background: rgba(0, 255, 255, 0.1);
            text-shadow: 0 0 3px cyan;
        }

        /* место с медалями */
        .rank-number {
            font-weight: 800;
            font-family: 'Orbitron';
        }
        .gold { color: #ffd966; text-shadow: 0 0 5px gold; }
        .silver { color: #c0c0c0; text-shadow: 0 0 5px silver; }
        .bronze { color: #cd7f32; text-shadow: 0 0 5px #cd7f32; }

        .player-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .player-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #0ff, #f0f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: white;
        }

        .rating-value {
            font-family: 'Orbitron';
            font-weight: bold;
            color: #0ff;
            letter-spacing: 1px;
        }

        /* Статус обновления */
        .update-info {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.75rem;
            color: #88aaff;
            border-top: 1px dashed rgba(0,255,255,0.3);
            padding-top: 1rem;
        }

        /* анимация загрузки */
        .loader-overlay {
            display: flex;
            justify-content: center;
            padding: 2rem;
        }
        .neon-loader {
            font-size: 2rem;
            color: cyan;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 700px) {
            .glass-card {
                padding: 1.2rem;
            }
            .period-btn {
                padding: 0.4rem 1rem;
                font-size: 0.7rem;
            }
            .rank-table th, .rank-table td {
                padding: 0.7rem 0.4rem;
                font-size: 0.75rem;
            }
            .title-section h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

<div class="cyber-bg">
    <div class="grid"></div>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
    <div class="glow-orb orb3"></div>
</div>

<header class="hero-header">
    <div class="header-border-glow"></div>
    <div class="header-content">
        <div class="brand">
            <div class="tetris-icon">
                <i class="fas fa-cubes"></i>
            </div>
            <div class="logo-text">
                <h1>⚡ PVP TETRIS ⚡</h1>
            </div>
        </div>
        <a href="#" class="back-link" id="backToHome"><i class="fas fa-arrow-left"></i> На главную</a>
    </div>
</header>

<!-- Рейтинговая секция -->
<div class="leaderboard-section">
    <div class="glass-card">
        <div class="leaderboard-header">
            <div class="title-section">
                <h2><i class="fas fa-trophy"></i> МИРОВОЙ РЕЙТИНГ</h2>
                <p>Топ-10 легенд PvP Tetris — их скорость и точность впечатляют</p>
            </div>
            <div class="period-switch">
                <button class="period-btn active" data-period="week">📆 ЗА НЕДЕЛЮ</button>
                <button class="period-btn" data-period="alltime">🏆 ЗА ВСЁ ВРЕМЯ</button>
            </div>
        </div>

        <div id="leaderboardContent">
            <!-- Здесь динамически будут отображаться данные рейтинга с эффектом загрузки -->
            <div class="loader-overlay">
                <i class="fas fa-sync-alt fa-spin neon-loader"></i>
            </div>
        </div>
        <div class="update-info">
            <i class="fas fa-sync-alt"></i> Данные обновляются в реальном времени | Сезон 2026
        </div>
    </div>
</div>

<script>
    // --- Генерация данных для рейтинга (имитация бэкенда) ---
    // Игроки для "за неделю" и "за всё время"
    const playersBase = [
        { name: "NeonMaster", avatar: "NM", country: "RU", baseRating: 28400 },
        { name: "CyberSage", avatar: "CS", country: "US", baseRating: 27150 },
        { name: "TetrisWizard", avatar: "TW", country: "KR", baseRating: 26320 },
        { name: "FrostByte", avatar: "FB", country: "CA", baseRating: 25890 },
        { name: "PixelKiller", avatar: "PK", country: "DE", baseRating: 24740 },
        { name: "Vortex", avatar: "VX", country: "FR", baseRating: 23900 },
        { name: "GlitchMode", avatar: "GM", country: "JP", baseRating: 23120 },
        { name: "QuantumLine", avatar: "QL", country: "UK", baseRating: 22450 },
        { name: "RageBlock", avatar: "RB", country: "BR", baseRating: 21800 },
        { name: "NovaStar", avatar: "NS", country: "AU", baseRating: 20900 }
    ];

    // Дополнительная вариация для недельного рейтинга (свежая активность)
    // генерируем смещения: игроки могут менять позиции
    function generateWeekData() {
        // копируем массив, но меняем рейтинг динамически (кто-то активнее)
        let weekPlayers = playersBase.map(p => ({ ...p, rating: p.baseRating + Math.floor(Math.random() * 800) - 200 }));
        // добавляем случайный порядок, но оставляем топ сильным
        weekPlayers.sort((a,b) => b.rating - a.rating);
        return weekPlayers.slice(0,10).map((player, idx) => ({
            rank: idx+1,
            name: player.name,
            avatar: player.avatar,
            rating: player.rating,
            country: player.country,
            wins: Math.floor(Math.random() * 120) + 30
        }));
    }

    function generateAlltimeData() {
        // за всё время - стабильные лидеры, почти как база
        let allPlayers = playersBase.map(p => ({ ...p, rating: p.baseRating + Math.floor(Math.random() * 300) }));
        allPlayers.sort((a,b) => b.rating - a.rating);
        return allPlayers.slice(0,10).map((player, idx) => ({
            rank: idx+1,
            name: player.name,
            avatar: player.avatar,
            rating: player.rating,
            country: player.country,
            wins: Math.floor(Math.random() * 450) + 180
        }));
    }

    // Кэш данных
    let cachedWeek = null;
    let cachedAlltime = null;

    function getWeekLeaderboard() {
        if(!cachedWeek) cachedWeek = generateWeekData();
        return cachedWeek;
    }

    function getAlltimeLeaderboard() {
        if(!cachedAlltime) cachedAlltime = generateAlltimeData();
        return cachedAlltime;
    }

    // Рендеринг таблицы с крутой анимацией при смене периода
    function renderLeaderboard(period) {
        const container = document.getElementById('leaderboardContent');
        // Эффект загрузки
        container.innerHTML = `<div class="loader-overlay"><i class="fas fa-sync-alt fa-spin neon-loader"></i> Загрузка матрицы рейтинга...</div>`;
        
        // Имитация небольшой задержки для вау-эффекта
        setTimeout(() => {
            let data = [];
            if(period === 'week') {
                data = getWeekLeaderboard();
            } else {
                data = getAlltimeLeaderboard();
            }
            
            // Построение HTML таблицы
            let html = `<div class="rank-table-container">
                            <table class="rank-table">
                                <thead>
                                    <tr><th>#</th><th>ИГРОК</th><th>РЕЙТИНГ</th><th>ПОБЕД</th><th>СТРАНА</th></tr>
                                </thead>
                                <tbody>`;
            
            data.forEach(player => {
                let rankClass = '';
                let medalIcon = '';
                if(player.rank === 1) { rankClass = 'gold'; medalIcon = '<i class="fas fa-crown"></i> '; }
                else if(player.rank === 2) rankClass = 'silver';
                else if(player.rank === 3) rankClass = 'bronze';
                
                let rankDisplay = `${medalIcon}${player.rank}`;
                html += `<tr>
                            <td class="rank-number ${rankClass}">${rankDisplay}</td>
                            <td><div class="player-name"><div class="player-avatar">${player.avatar}</div> ${player.name}</div></td>
                            <td class="rating-value">${player.rating.toLocaleString()} <i class="fas fa-bolt" style="font-size:0.7rem;"></i></td>
                            <td>${player.wins} 🏆</td>
                            <td><i class="fas fa-globe-americas"></i> ${player.country}</td>
                         </tr>`;
            });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
            
            // добавим дополнительный неоновый флеш на обновление
            const card = document.querySelector('.glass-card');
            card.style.transform = 'scale(0.99)';
            setTimeout(() => { card.style.transform = ''; }, 150);
            
            // активируем "искры" на заголовке
            createLeaderboardSpark();
        }, 300);
    }
    
    // маленькая визуальная искра при переключении
    function createLeaderboardSpark() {
        const headerElem = document.querySelector('.leaderboard-header');
        if(headerElem) {
            headerElem.style.textShadow = '0 0 8px cyan';
            setTimeout(() => { headerElem.style.textShadow = ''; }, 300);
        }
    }
    
    // Обработка кнопок периода и активная смена
    let currentPeriod = 'week';
    const weekBtn = document.querySelector('.period-btn[data-period="week"]');
    const alltimeBtn = document.querySelector('.period-btn[data-period="alltime"]');
    
    function setActivePeriod(period) {
        if(period === 'week') {
            weekBtn.classList.add('active');
            alltimeBtn.classList.remove('active');
        } else {
            alltimeBtn.classList.add('active');
            weekBtn.classList.remove('active');
        }
        currentPeriod = period;
        renderLeaderboard(currentPeriod);
    }
    
    weekBtn.addEventListener('click', () => {
        if(currentPeriod === 'week') return;
        setActivePeriod('week');
    });
    
    alltimeBtn.addEventListener('click', () => {
        if(currentPeriod === 'alltime') return;
        setActivePeriod('alltime');
    });
    
    // Инициализация рейтинга по умолчанию (неделя)
    renderLeaderboard('week');
    
    // "На главную" (кнопка)
    document.getElementById('backToHome').addEventListener('click', (e) => {
        e.preventDefault();
        alert('Возврат на главную страницу PvP Tetris (демо)');
        // здесь мог бы быть переход, но для демонстрации просто сообщение
    });
    
    // Имитация обновления данных в реальном времени (каждые 10 секунд для недельного рейтинга)
    // Создаём иллюзию живого рейтинга
    let updateInterval;
    function startDynamicLeaderboardUpdate() {
        updateInterval = setInterval(() => {
            if(currentPeriod === 'week') {
                // Обновляем недельный кеш (с легкими изменениями)
                cachedWeek = generateWeekData();
                renderLeaderboard('week');
            } else {
                // Для alltime реже меняем, но тоже можно обновить (небольшая вариация)
                cachedAlltime = generateAlltimeData();
                renderLeaderboard('alltime');
            }
            // Показываем уведомление (не навязчиво)
            const infoBlock = document.querySelector('.update-info');
            infoBlock.style.opacity = '0.7';
            setTimeout(() => { infoBlock.style.opacity = '1'; }, 300);
        }, 15000); // каждые 15 секунд обновление (вау-эффект динамики)
    }
    
    startDynamicLeaderboardUpdate();
    
    // дополнительный крутой эффект при наведении на строки рейтинга (уже через css)
    // сделать hover для колонок с анимацией
    const style = document.createElement('style');
    style.textContent = `
        .rank-table tr {
            transition: all 0.2s;
        }
        .rank-table tr:hover .rating-value {
            text-shadow: 0 0 8px cyan;
            color: #fff;
        }
        .rank-number.gold { font-size: 1.2rem; }
    `;
    document.head.appendChild(style);
    
    // Добавляем эффект "парящих" кубиков на задний план по клику на рейтинг
    const leaderboardSection = document.querySelector('.leaderboard-section');
    leaderboardSection.addEventListener('click', (e) => {
        // создаем маленький эффект частиц при клике внутри таблицы (только если клик по таблице)
        if(e.target.closest('.rank-table')) {
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX;
            const y = e.clientY;
            for(let i=0;i<6;i++) {
                const particle = document.createElement('div');
                particle.innerHTML = '<i class="fas fa-cube"></i>';
                particle.style.position = 'fixed';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.color = `hsl(${Math.random() * 90 + 180}, 100%, 60%)`;
                particle.style.fontSize = '14px';
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '9999';
                particle.style.opacity = '1';
                particle.style.transition = 'all 0.6s ease-out';
                document.body.appendChild(particle);
                const dx = (Math.random() - 0.5) * 50;
                const dy = (Math.random() - 0.5) * 50 - 20;
                setTimeout(() => {
                    particle.style.transform = `translate(${dx}px, ${dy}px)`;
                    particle.style.opacity = '0';
                }, 10);
                setTimeout(() => particle.remove(), 700);
            }
        }
    });
    
    // эффект мерцания градиента карты при переключении периода
    function addGlowOnToggle() {
        const card = document.querySelector('.glass-card');
        card.style.transition = 'box-shadow 0.2s';
        card.style.boxShadow = '0 0 30px rgba(0, 255, 255, 0.5)';
        setTimeout(() => { card.style.boxShadow = ''; }, 400);
    }
    
    // перехватываем клики по периодам и добавляем доп. свечение
    weekBtn.addEventListener('click', addGlowOnToggle);
    alltimeBtn.addEventListener('click', addGlowOnToggle);
    
    // загрузка завершена, выводим в консоль красивый привет
